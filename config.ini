# ============================================================
#  周末活动雷达 —— 运行配置
#
#  留空 = 使用内置默认值。相对路径一律相对项目根，不依赖 cwd。
#  支持命令行覆盖：--city 上海 --provider deepseek --channel feishu
#  支持环境变量覆盖：RADAR_CITY / RADAR_LLM_PROVIDER / RADAR_LLM_KEY / RADAR_PUSH_CHANNEL 等
# ============================================================

[radar]
# 只看未来多少天内的周末
window_days = 30
# 报告输出目录，按运行日期命名 YYYY-MM-DD.md
out_dir = data/reports
# SQLite 状态库，差分的事实来源
db = data/radar.sqlite
# 是否只收周六周日。C 类博览会不受此限制（要标注有无周末场）
weekend_only = true
# ★ 目标城市（内置预设：北京/上海/广州/深圳/杭州/成都/武汉/南京/西安/重庆/苏州/天津/长沙）
#   修改此项会自动联动 B站/CPP/大麦城市码、本地宝/豆瓣子域名及场馆简称映射
city = 北京
# 名字里含这些词就丢弃：抽到的是「不可用/非门票」条目，不是活动
exclude_keywords = 取消,不含门票,已售罄,停办,话剧,戏剧,舞台剧,音乐剧,歌剧,舞剧,戏曲,京剧,越剧,黄梅戏,评剧,豫剧,昆曲,独角戏,开心麻花,大戏,剧社,餐食剧,沉浸剧,相声,脱口秀,单口喜剧,即兴喜剧,开放麦,漫才,喜剧,小剧场,德云社,嘻哈包袱铺,喜番,刘老根
# ★ 连续缺席几轮才判定「取消」。不要设 1 —— LLM 每次转述会波动，
#   一缺就判会天天误报「活动取消」并触发推送。
gone_after_misses = 2
# ★ 只有这些源参与「取消」判定（确定性源）。LLM 抽取的源每轮覆盖条数会波动，
#   把它们的缺席当取消会天天误报。逗号分隔。
stable_sources = bili
# ★ 一次变更要连续几轮都成立才写进报告/触发推送。不要设 1。
confirm_runs = 2

[llm]
# ★ AI 服务商预设：
#   magic       = 本机 Magic 网关 (127.0.0.1:3425，自动读 caller-keys.json)
#   openai      = OpenAI 官方或兼容接口 (默认读环境变量 OPENAI_API_KEY)
#   anthropic   = Anthropic 官方或兼容接口 (默认读 ANTHROPIC_API_KEY)
#   deepseek    = DeepSeek 官方 (默认读 DEEPSEEK_API_KEY，默认模型 deepseek-chat)
#   siliconflow = 硅基流动 (默认读 SILICONFLOW_API_KEY)
#   openrouter  = OpenRouter (默认读 OPENROUTER_API_KEY)
#   dashscope   = 阿里云百炼 / 通义千问 (默认读 DASHSCOPE_API_KEY)
#   zhipu       = 智谱 BigModel (默认读 ZHIPU_API_KEY)
#   ollama      = 本地 Ollama (http://127.0.0.1:11434/v1，免 Key)
#   custom      = 完全使用下方 base_url + mode + model
provider = magic
# 留空或保持默认时，非 magic 的 provider 会自动使用其官方 base_url 与默认模型
base_url = http://127.0.0.1:3425
# openai | anthropic | auto   （auto 会先试 openai 再试 anthropic）
mode = auto
# ★ 由 --probe 结果决定。若探测失败就换一个，或用 --probe 看返回的可用模型名
model = group/deepseek-v4-1-flash
# API Key：留空则优先读对应 Provider 的环境变量（如 DEEPSEEK_API_KEY / RADAR_LLM_KEY），
# provider=magic 时自动回退读 key_file 里 lan=true 那条的 secret
key =
key_file = ~/.config/magpie/caller-keys.json
# 单页送进模型的字符上限，超出截断（截断会在报告里标出来）
max_chars = 24000
temperature = 0
timeout = 90

[fetch]
# 请求间隔秒数。别调 0——同站高频是最容易被封的原因
interval = 2
timeout = 20
retries = 3
backoff_base = 2
# ★ 只有 80 端口的站点，必须走 http。这些域名不升级 https
allow_http = www.090expo.com,090expo.com,www.manzhan.com,manzhan.com

[extra]
# 以下城市码在切换 [radar] city 时会自动按城市预设联动；只有需要手工强制指定时才改
# 大麦城市码：北京=101010100, 上海=101020100, 广州=101280100, 深圳=101280600
damai_city = 101010100
damai_keyword = 漫展
# B站会员购与CPP同人展行政区划码：北京=110000, 上海=310000, 广州=440100, 深圳=440300
bili_area = 110000
bili_ptype = 展览
bili_pagesize = 20
cpp_city = 110000
cpp_pagesize = 30
# ★ 090expo 的「漫展演出排期表」文章 ID 每月变一次。
#   留空 = 自动去列表页按当前城市名查找当月排期文章。
#   2026 年 11 月北京：http://www.090expo.com/news/exnews_7772.html
expo090_article = http://www.090expo.com/news/exnews_7772.html

[push]
# ★ 双开关之一：不是 true 就绝不推送，即使 --run
enabled = true
# ★ 交付渠道（支持单选或多渠道逗号分隔，如：feishu,bark）：
#   pushdeer | feishu | wecom | dingtalk | bark | telegram | serverchan
channel = pushdeer
# 推送格式：markdown（移动端流式卡片，默认推荐）或 text（纯文本）
format = markdown
# 无实质变化时不推；有源失败时无论如何推一条健康告警
notify_on_no_change = false
notify_on_source_failure = true
# ★ 新增条数达到多少才触发推送。设太小会被 LLM 抽取抖动骗到（同一天跑两次
#   能差出十几条），设太大会漏掉真新闻。3 是实测下来比较稳的值。
min_new_changes = 3
max_chars = 30000

# ---- 1. PushDeer 模板 ----
endpoint = https://api2.pushdeer.com/message/push
pushkey =

# ---- 2. 飞书自定义机器人模板 (channel = feishu) ----
feishu_webhook =
# 可选：开启签名校验时填入密钥（自动计算 HMAC-SHA256 sign）
feishu_secret =

# ---- 3. 企业微信群机器人模板 (channel = wecom) ----
# 填完整 webhook URL 或只填 wecom_key 二选一即可（自动按 4096 字节上限安全截断）
wecom_webhook =
wecom_key =

# ---- 4. 钉钉群机器人模板 (channel = dingtalk) ----
dingtalk_webhook =
# 可选：加签密钥（SEC 开头，自动计算 timestamp + sign 拼接到 URL）
dingtalk_secret =

# ---- 5. Bark (iOS) 模板 (channel = bark) ----
# 填自建/官方完整地址（如 https://api.day.app/你的Key）或只填 bark_key
bark_url =
bark_key =

# ---- 6. Telegram Bot 模板 (channel = telegram) ----
telegram_bot_token =
telegram_chat_id =

# ---- 7. Server酱 (Turbo / Server酱3) 模板 (channel = serverchan) ----
serverchan_sendkey =

# ---- 通用覆盖（单渠道时可直接填 webhook / secret） ----
webhook =
secret =

# ------------------------------------------------------------
